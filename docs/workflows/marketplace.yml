name: Publish Marketplace
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag (for example v0.2.22)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marketplace
  cancel-in-progress: false
jobs:
  publish:
    if: vars.MARKETPLACE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release and publisher
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          MARKETPLACE_PUBLISHER: ${{ vars.MARKETPLACE_PUBLISHER }}
        run: node scripts/check-release.cjs --marketplace
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Download verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern '*.vsix' --pattern '*.sha256' --dir dist
      - run: node scripts/verify-artifact.cjs dist
      - name: Publish same VSIX with Trusted Publishing
        run: npx vsce publish --oidc --packagePath dist/*.vsix
